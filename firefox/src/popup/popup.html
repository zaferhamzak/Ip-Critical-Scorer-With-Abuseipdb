<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>IP Critical Scorer</title>
  <link rel="stylesheet" href="../options/options.css">
  <link rel="stylesheet" href="popup.css">
  <script src="../shared/export.js"></script>
  <script type="module" src="popup.js"></script>
</head>
<body class="popup-page">
  <header class="pop-head">
    <img src="../../icons/icon-48.png" alt="" width="28" height="28">
    <div class="brand">
      <p class="eyebrow">AbuseIPDB</p>
      <h1>IP Critical Scorer</h1>
    </div>
    <span class="chip mono" id="version-status" title="Chrome Web Store tarafından otomatik güncellenir">v–</span>
  </header>

  <main>
    <div class="status-grid">
      <div class="stat">
        <p class="eyebrow">Anahtar</p>
        <strong id="api-status" class="stat-value">yükleniyor…</strong>
      </div>
      <div class="stat" id="quota-box">
        <p class="eyebrow">Kalan hak</p>
        <strong id="quota-status" class="stat-value mono">—</strong>
        <span class="meter" aria-hidden="true"><span id="quota-meter"></span></span>
      </div>
    </div>

    <section class="pop-card" aria-labelledby="site-title">
      <p class="eyebrow" id="site-title">Bu site</p>
      <div class="site-line">
        <span class="dot" id="site-dot" data-state="unknown" aria-hidden="true"></span>
        <div class="site-text">
          <strong id="site-host" class="mono">—</strong>
          <span id="site-status">yükleniyor…</span>
        </div>
      </div>
      <button type="button" id="site-enable" class="block" hidden>Bu sitede etkinleştir</button>
    </section>

    <section class="pop-card list-card" aria-labelledby="list-title" id="list-section" hidden>
      <div class="list-head">
        <div>
          <p class="eyebrow" id="list-title">Excel listesi</p>
          <p class="count"><strong id="list-count" class="mono">0</strong> <span>IP seçili</span></p>
        </div>
        <button type="button" id="list-open" class="secondary small">Düzenle</button>
      </div>
      <p id="list-status" class="hint small"></p>
      <button type="button" id="list-copy" class="block">Listeyi Excel'e kopyala</button>
    </section>

    <section class="pop-card" aria-labelledby="api-title">
      <details id="api-details">
        <summary><span class="eyebrow" id="api-title">API anahtarı</span><span class="summary-action">Değiştir</span></summary>
        <form id="api-form" autocomplete="off">
          <label class="sr-only" for="api-key">AbuseIPDB API anahtarı</label>
          <div class="inline-control">
            <input id="api-key" type="password" spellcheck="false" autocomplete="off">
            <button type="submit">Kaydet</button>
          </div>
          <div class="form-foot">
            <label class="check"><input id="api-reveal" type="checkbox"> Göster</label>
            <button type="button" id="api-remove" class="link-danger">Anahtarı sil</button>
          </div>
        </form>
        <p class="hint small">Yalnızca bu tarayıcıda saklanır ve yalnızca <code>api.abuseipdb.com</code> adresine gönderilir.</p>
      </details>
    </section>
  </main>

  <footer class="pop-foot">
    <button type="button" id="open-history" class="secondary">Sorgu geçmişi</button>
    <button type="button" id="open-options" class="secondary">Ayarlar</button>
  </footer>

  <p id="message" class="toast" role="status" aria-live="polite"></p>
</body>
</html>
