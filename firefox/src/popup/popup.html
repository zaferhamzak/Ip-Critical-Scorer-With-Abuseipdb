<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>IP Critical Scorer</title>
  <link rel="stylesheet" href="../options/options.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <h1>IP Critical Scorer</h1>

    <section aria-labelledby="api-title">
      <h2 id="api-title">API anahtarı</h2>
      <p>Durum: <strong id="api-status">yükleniyor…</strong></p>
      <form id="api-form" autocomplete="off">
        <label for="api-key">AbuseIPDB API anahtarı</label>
        <input id="api-key" type="password" spellcheck="false" autocomplete="off">
        <label class="inline"><input id="api-reveal" type="checkbox"> Yazarken göster</label>
        <div class="row">
          <button type="submit">Kaydet</button>
          <button type="button" id="api-remove" class="secondary">Sil</button>
        </div>
      </form>
      <p class="hint">Anahtar isteğe bağlıdır; yalnızca bu tarayıcıda saklanır ve yalnızca <code>api.abuseipdb.com</code> adresine gönderilir.</p>
    </section>

    <p id="quota-status" class="hint quota-line" hidden></p>

    <section aria-labelledby="site-title">
      <h2 id="site-title">Bu site</h2>
      <p id="site-status">yükleniyor…</p>
      <div class="row">
        <button type="button" id="site-enable" hidden>Bu sitede etkinleştir</button>
      </div>
    </section>

    <section aria-labelledby="version-title">
      <h2 id="version-title">Sürüm</h2>
      <p id="version-status">yükleniyor…</p>
    </section>

    <div class="row">
      <button type="button" id="open-history">Sorgu geçmişi</button>
      <button type="button" id="open-options" class="secondary">Tüm ayarlar</button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
